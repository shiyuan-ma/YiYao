<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改相册管理')" />
    <th:block th:include="include :: bootstrap-fileinput-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-album-edit" th:object="${photoAlbum}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">相册名称：</label>
                <div class="col-sm-8">
                    <input name="albumName" th:field="*{albumName}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">相册描述：</label>
                <div class="col-sm-8">
                    <textarea name="description" th:field="*{description}" class="form-control" rows="3"></textarea>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">封面图片：</label>
                <div class="col-sm-8">
                    <input type="hidden" name="coverImage" th:field="*{coverImage}">
                    <div class="file-loading">
                        <input class="form-control file-upload" id="coverImage" name="file" type="file">
                    </div>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">备注：</label>
                <div class="col-sm-8">
                    <textarea name="remark" th:field="*{remark}" class="form-control" rows="3"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: bootstrap-fileinput-js" />
    <script type="text/javascript">
        var prefix = ctx + "album/list";
        $("#form-album-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-album-edit').serialize());
            }
        }

        $(function() {
            var val = $("input[name='coverImage']").val();
            $(".file-upload").fileinput({
                uploadUrl: ctx + 'common/upload',
                initialPreviewAsData: true,
                initialPreview: val ? [val] : [],
                maxFileCount: 1,
                autoReplace: true,
                allowedFileExtensions: ['jpg', 'jpeg', 'png', 'gif', 'bmp'],
                showUpload: false
            }).on('fileuploaded', function (event, data, previewId, index) {
                $("input[name='" + event.currentTarget.id + "']").val(data.response.url)
            }).on('fileremoved', function (event, id, index) {
                $("input[name='" + event.currentTarget.id + "']").val('')
            });
        });
    </script>
</body>
</html>

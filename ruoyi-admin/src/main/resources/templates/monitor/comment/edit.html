<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改单位日志')" />
    <th:block th:include="include :: summernote-css" />
    <th:block th:include="include :: datetimepicker-css" />
</head>
<body>
<div class="form-content">
    <form class="form-horizontal" id="form-comment-edit" th:object="${comment}">
        <!-- 隐藏的ID，必须有 -->
        <input name="id" th:field="*{id}" type="hidden">

        <div class="form-group">
            <label class="col-sm-3 control-label">用户名：</label>
            <div class="col-sm-8">
                <!-- 用户名通常不允许修改，所以是只读的 -->
                <input class="form-control" type="text" th:field="*{userName}" readonly="true">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">帖子ID：</label>
            <div class="col-sm-8">
                <!-- 帖子ID通常也不允许修改 -->
                <input class="form-control" type="text" th:field="*{topicId}" readonly="true">
            </div>
        </div>

        <!-- 【新增字段】显示发帖时间 -->
        <div class="form-group">
            <label class="col-sm-3 control-label">发帖时间：</label>
            <div class="col-sm-8">
                <div class="input-group date">
                    <input name="postTime" th:value="${#dates.format(comment.postTime, 'yyyy-MM-dd HH:mm:ss')}" class="form-control" placeholder="yyyy-MM-dd HH:mm:ss" type="text" readonly>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label is-required">日志内容：</label>
            <div class="col-sm-8">
                <!-- 隐藏的input，用于在提交时存储富文本编辑器的内容 -->
                <input type="hidden" class="form-control" th:field="*{content}">
                <!-- Summernote 富文本编辑器的容器 -->
                <div class="summernote" id="contentEditor"></div>
            </div>
        </div>

        <!-- 您还可以根据需要，在这里添加Comment实体中的其他字段，比如IP地址等 -->
        <!--
        <div class="form-group">
            <label class="col-sm-3 control-label">记录IP：</label>
            <div class="col-sm-8">
                <input class="form-control" type="text" th:field="*{ip}" readonly="true">
            </div>
        </div>
        -->
    </form>
</div>

<!-- JS 脚本 -->
<th:block th:include="include :: footer" />
<th:block th:include="include :: summernote-js" />
<th:block th:include="include :: datetimepicker-js" />

<!-- 【关键修改区域】 -->
<script th:inline="javascript">
    // 使用内联注释块，安全地将后端Java变量转为JS变量
    // 增加了一个判断：如果后端传来的 comment.content 是 null, 就给JS变量赋一个空字符串''
    var content = /*[[${comment.content != null ? comment.content : ''}]]*/;

    var prefix = ctx + "monitor/comment";

    $(function() {
        // 初始化富文本编辑器
        $('#contentEditor').summernote({
            lang: 'zh-CN',
            height: 260, // 调整了高度
            focus: true,
            callbacks: {
                // 当编辑器内容改变时，同步更新到隐藏的input中
                onChange: function(contents, $editable) {
                    $("#form-comment-edit input[name='content']").val(contents);
                }
            }
        });

        // 将JS变量中的HTML内容填充到编辑器中
        $('#contentEditor').summernote('code', content);
    });

    // 提交处理
    function submitHandler() {
        if ($.validate.form()) {
            // 从编辑器获取最新的HTML内容 (这是一个好习惯，但因为有onChange回调，也可以省略)
            var sHTML = $('#contentEditor').summernote('code');
            $("#form-comment-edit input[name='content']").val(sHTML);

            // 检查内容是否为空
            if (sHTML === '' || sHTML === '<p><br></p>') {
                $.modal.alertWarning("日志内容不能为空！");
                return;
            }

            $.operate.save(prefix + "/edit", $('#form-comment-edit').serialize());
        }
    }
</script>
</body>
</html>
